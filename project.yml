name: Desklamp
options:
  bundleIdPrefix: com.seansmith
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Desklamp:
    type: application
    platform: macOS
    sources:
      - path: Desklamp
        excludes: [AppIcon.icon]
      # Icon Composer document (macOS 26+); Assets.xcassets/AppIcon.appiconset is the pre-26 fallback.
      - path: Desklamp/AppIcon.icon
        type: file
        buildPhase: resources
    info:
      path: Desklamp/Info.plist
      properties:
        CFBundleDisplayName: Desklamp
        LSUIElement: true
    entitlements:
      path: Desklamp/Desklamp.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seansmith.desklamp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_IDENTITY: "-"
  DesklampTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - DesklampTests
      - Desklamp/SleepAssertion.swift
      - Desklamp/AwakeController.swift
      - Desklamp/LampStage.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seansmith.desklamp.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Desklamp:
    build:
      targets:
        Desklamp: all
        DesklampTests: [test]
    test:
      targets: [DesklampTests]
