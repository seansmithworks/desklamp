name: Lamplight
options:
  bundleIdPrefix: com.seansmith
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Lamplight:
    type: application
    platform: macOS
    sources:
      - path: Lamplight
        excludes: [AppIcon.icon]
      # Icon Composer document (macOS 26+); Assets.xcassets/AppIcon.appiconset is the pre-26 fallback.
      - path: Lamplight/AppIcon.icon
        type: file
        buildPhase: resources
    info:
      path: Lamplight/Info.plist
      properties:
        CFBundleDisplayName: Lamplight
        LSUIElement: true
    entitlements:
      path: Lamplight/Lamplight.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seansmith.lamplight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_IDENTITY: "-"
  LamplightTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - LamplightTests
      - Lamplight/SleepAssertion.swift
      - Lamplight/AwakeController.swift
      - Lamplight/LampStage.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seansmith.lamplight.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Lamplight:
    build:
      targets:
        Lamplight: all
        LamplightTests: [test]
    test:
      targets: [LamplightTests]
