name: Awake
options:
  bundleIdPrefix: com.seansmith
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Awake:
    type: application
    platform: macOS
    sources: [Awake]
    info:
      path: Awake/Info.plist
      properties:
        CFBundleDisplayName: Awake
        LSUIElement: true
    entitlements:
      path: Awake/Awake.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seansmith.awake
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_IDENTITY: "-"
  AwakeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - AwakeTests
      - Awake/SleepAssertion.swift
      - Awake/AwakeController.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seansmith.awake.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Awake:
    build:
      targets:
        Awake: all
        AwakeTests: [test]
    test:
      targets: [AwakeTests]
